[project]
name = "recon"
version = "0.1.0"
description = "Remote host control MCP server: exec, chunked upload/download for Windows & Linux"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9.0,<2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "tomli>=2.0; python_version < '3.11'",
    "pycryptodome>=3.20",
]

[project.scripts]
recon = "recon.__main__:main"
recon-server = "recon.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
